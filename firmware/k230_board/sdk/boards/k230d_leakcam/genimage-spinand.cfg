# LEAKCAM SPI NAND image. Boot: ROM -> SPL -> RT-Smart, directly: the SPL reads the TOC, loads
# slot A (slot B if A does not load) and starts it on the big core. U-Boot is not on the normal
# path; the SPL falls back to it only when there is no valid TOC or neither slot loads (U-Boot's
# k230_boot then starts RT-Smart from 5M = slot A).
# Winbond W25N02KV, 256 MiB, page 2048 + 128 B spare, 64 pages/block, 2048 blocks. UFFS uses the
# first 64 spare bytes only: that is the chip's user OOB (bad-block marker 0-1, free 2-15/18-31/
# 34-47/50-63); bytes 64-127 hold the on-die ECC parity, written by the chip. install.sh makes the
# RT-Smart NAND glue report the same 64 bytes to UFFS (UFFS caps spare buffers at 64 for 2 KiB
# pages), so image and kernel use one geometry, as on the K230 EVB.
# Layout: 0 SPL a, 512K SPL b,
# 896K TOC, 1M ota_meta, 2M U-Boot, 4M env, 5M rtt_a, 25M rtt_b, 48M /bin, 72M /sdcard.
flash spinand-256m {
	uffs = true
	page-size = 2048
	block-pages = 64
	total-blocks = 2048
	spare-size = 64
	status-offset = 0
}

image  bin.uffs {
	uffs {
		size = 20M
	}
	size = 20M
	mountpoint = "bin"
	flashtype = "spinand-256m"
}

image  sdcard.uffs {
	uffs {
		size = 50M
	}
	size = 50M
	mountpoint = "sdcard"
	flashtype = "spinand-256m"
}

image sysimage-spinand.kdimg {
	flashtype = "spinand-256m"
	kdimage {
		image_info = "v1.0.0"
		chip_info = "K230D"
		board_info = "LEAKCAM_K230D_spi_nand"
		# direct boot: the SPL reads this TOC (fixed at 0xe0000 in k230_boot.c) and starts
		# RT-Smart itself; U-Boot is only the fallback when no valid TOC is found
		toc = true
		toc-offset = 0xe0000
	}

	partition spl_a {
		in-partition-table = false
		offset = 0
		image = "uboot/swap_fn_u-boot-spl.bin"
	}

	partition spl_b {
		in-partition-table = false
		offset = 512K
		image = "uboot/swap_fn_u-boot-spl.bin"
	}

	# A/B slot record (two copies, written by OTA, read by the SPL). Own erase blocks: on NAND the
	# CanMV SD offset 0xf0000 would share the TOC's 128 KiB block, and rewriting it would erase the TOC
	partition ota_meta {
		in-partition-table = false
		offset = 1M
		size = 256K
	}

	partition uboot {
		in-partition-table = false
		offset = 2M
		size = 2M
		image = "uboot/fn_ug_u-boot.bin"
	}

	partition uboot_env {
		in-partition-table = false
		offset = 4M
		size = 512K
		image = "uboot/env.bin"
	}

	partition rtt_a {
		in-partition-table = false
		offset = 5M
		size = 20M
		image = "opensbi/opensbi_rtt_system.bin"
		load = true
		boot = 0x3
	}

	# slot B: the SPL falls back to it when slot A does not load; OTA writes the inactive slot
	partition rtt_b {
		in-partition-table = false
		offset = 25M
		size = 20M
		image = "opensbi/opensbi_rtt_system.bin"
		load = true
		boot = 0x3
	}

	partition bin {
		in-partition-table = false
		flag = 0x400000008000040 # write_with_oob, page size 2048, oob size 64 (user OOB)
		offset = 48M
		image = "bin.uffs"
	}

	partition sdcard {
		in-partition-table = false
		flag = 0x400000008000040 # write_with_oob, page size 2048, oob size 64 (user OOB)
		offset = 72M
		size = 176M
		image = "sdcard.uffs"
	}
}
