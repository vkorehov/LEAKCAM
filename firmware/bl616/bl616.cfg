# OpenOCD target file: BL616 (T-Head E907 core) for OpenOCD 0.12 (the Ubuntu 24.04 package; the
# SDK's bundled openocd is x86-64 only). Same as bouffalo_sdk/tools/openocd/target/tgt_e907.cfg,
# with the 0.12 command names and without its work area (0x40000000 is not BL616 RAM; halt,
# step, breakpoints and memory access need none).
#   openocd -f hw-usbn-2b.cfg -f bl616.cfg
jtag newtap bl616 cpu -irlen 5 -expected-id 0x10000b6f
target create bl616.cpu riscv -chain-position bl616.cpu

gdb_memory_map enable
gdb_flash_program disable

riscv set_mem_access progbuf sysbus abstract
riscv set_command_timeout_sec 3
