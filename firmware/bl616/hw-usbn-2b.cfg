# OpenOCD adapter file: Lattice HW-USBN-2B (FT2232H, JTAG on channel A in MPSSE mode) for the
# BL616 JTAG debug build (DEBUG.txt, section 3).
#   openocd -f hw-usbn-2b.cfg -f bl616.cfg          (Ubuntu openocd 0.12, from firmware/bl616)
# ADBUS0 TCK, ADBUS1 TDI, ADBUS2 TDO, ADBUS3 TMS: the FTDI MPSSE JTAG pins. The cable's level
# shifters take their supply from the red VCC lead, so it must sit on 3V3_SLEEP (PR1.6).
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
# TMS high, TCK/TDI/TMS driven, TDO input; ADBUS4-7 left as inputs
ftdi layout_init 0x0008 0x000b
ftdi tdo_sample_edge falling
transport select jtag
adapter speed 1000
